<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORMA-GARD · Bientôt disponible</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="FORMA-GARD ouvre bientôt.">
<meta property="og:title" content="FORMA-GARD · Bientôt disponible">
<meta property="og:image" content="https://forma-gard.com/partage.png">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--nuit:#0e2442;--nuit2:#071427;--or:#c4b99a;--or2:#9a8060}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:'DM Sans',system-ui,sans-serif;color:#fff;background:var(--nuit2);
    background:radial-gradient(900px 520px at 50% 110%,rgba(196,185,154,.25),transparent 65%),
               radial-gradient(800px 600px at 0% 0%,#1a3a66,transparent 70%),
               linear-gradient(165deg,var(--nuit),var(--nuit2));
    display:flex;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
  main{max-width:560px}
  .logo{width:min(300px,70vw);height:auto;display:block;margin:0 auto 44px}
  h1{font-size:clamp(34px,6vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .trait{width:64px;height:3px;border-radius:2px;margin:26px auto;background:linear-gradient(90deg,var(--or),var(--or2))}
  p{font-size:18px;line-height:1.6;color:rgba(255,255,255,.75)}
  a{color:var(--or);text-decoration:none;font-weight:500}
  .contact{margin-top:28px;font-size:16px}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo-blanc.png" alt="FORMA-GARD">
  <h1>Bientôt disponible</h1>
  <div class="trait"></div>
  <p>Notre site ouvre très prochainement.</p>
  <p class="contact"><a href="mailto:contact@forma-gard.com">contact@forma-gard.com</a></p>
</main>
</body>
</html>
