# Change tout seul la page d'accueil selon la date (heure de Paris) :
#   novembre et jusqu'au 25 décembre -> Noël ; du 26 au 31 décembre -> fêtes (offre de décembre jusqu'au 31) ;
#   à partir du 1er janvier -> normale (prix normaux).
name: Page d'accueil selon la saison
on:
  schedule:
    - cron: '5 23 25 12 *'   # nuit du 25 au 26 décembre
    - cron: '5 23 31 12 *'   # nuit du 31 décembre au 1er janvier
    - cron: '17 6 * * 1'     # contrôle chaque lundi matin, au cas où
  workflow_dispatch:
permissions:
  contents: write
jobs:
  saison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choisir la bonne page
        run: |
          J=$(TZ=Europe/Paris date +%m%d)
          if [ "$J" -ge 1226 ]; then P=nouvel-an
          elif [ "$J" -ge 1101 ]; then P=noel
          else P=normal; fi
          echo "Page du jour : $P"
          cp "saisons/$P.html" accueil-0pzt549izz.html
          if git diff --quiet accueil-0pzt549izz.html; then echo "Rien à changer"; exit 0; fi
          git config user.name "FORMA-GARD (automatique)"
          git config user.email "contact@forma-gard.com"
          git add accueil-0pzt549izz.html
          git commit -m "Page d'accueil : $P"
          git push
