# Change tout seul la page d'accueil selon la date (heure de Paris) :
#   jusqu'au 25 décembre -> Noël ; du 26 décembre au 30 janvier -> Nouvel An ; à partir du 31 janvier -> normale.
name: Page d'accueil selon la saison
on:
  schedule:
    - cron: '5 23 25 12 *'   # nuit du 25 au 26 décembre
    - cron: '5 23 30 1 *'    # nuit du 30 au 31 janvier
    - cron: '17 6 * * 1'     # contrôle chaque lundi matin, au cas où
  workflow_dispatch:
permissions:
  contents: write
jobs:
  saison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choisir la bonne page
        run: |
          J=$(TZ=Europe/Paris date +%m%d)
          if [ "$J" -ge 1226 ] || [ "$J" -le 0130 ]; then P=nouvel-an
          elif [ "$J" -ge 1101 ]; then P=noel
          else P=normal; fi
          echo "Page du jour : $P"
          cp "saisons/$P.html" index.html
          if git diff --quiet index.html; then echo "Rien à changer"; exit 0; fi
          git config user.name "FORMA-GARD (automatique)"
          git config user.email "contact@forma-gard.com"
          git add index.html
          git commit -m "Page d'accueil : $P"
          git push
